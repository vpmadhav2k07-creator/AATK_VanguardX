services:
  - type: web
    name: AATK_VanguardX
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: LICHESS_TOKEN
        sync: false   # keep secret safe, set value in Render dashboard
      - key: PORT
        value: "8080"
    region: oregon
    plan: free        # or starter/standard depending on your Render plan
